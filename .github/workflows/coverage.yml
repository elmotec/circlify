name: Coverage report

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Read latest supported Python version
      id: supported
      run: echo "latest=$(python3 scripts/supported_pythons.py --latest)" >> "$GITHUB_OUTPUT"
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: ${{ steps.supported.outputs.latest }}
    - uses: astral-sh/setup-uv@v10.3.3
    - name: Sync dependencies
      run: uv sync --locked
    - name: Generate coverage report
      run: make coverage

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v7
      with:
        fail_ci_if_error: true
        files: ./coverage.xml
        token: ${{ secrets.CODECOV_TOKEN }}
